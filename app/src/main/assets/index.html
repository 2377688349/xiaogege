<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f2">
<title>日日 · 习惯打卡</title>
<style>
:root{--bg:#f7f8f2;--ink:#243c32;--muted:#788178;--green:#375e48;--light:#e9efdf;--line:#e2e6db}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #a6b976;outline-offset:3px}button{border:0;background:none}header{max-width:1100px;margin:auto;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:750;letter-spacing:3px}.brand span{display:inline-grid;place-items:center;background:var(--green);color:white;border-radius:13px;width:39px;height:39px;margin-right:12px;letter-spacing:0}.tag{font-size:12px;color:var(--muted)}main{max-width:900px;margin:50px auto;padding:0 26px 70px}h1{font-size:38px;letter-spacing:-1px;line-height:1.3;margin:12px 0}h2{font-size:20px;margin:0}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted);font-weight:700}.subtitle{color:var(--muted);margin:12px 0 0}.hero{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:34px}.plant{width:112px;height:112px;flex-shrink:0;border-radius:50%;background:#e9edda;display:grid;place-items:center}.plant svg{width:78px;height:78px}.summary{background:var(--green);color:#fff;border-radius:24px;padding:27px 30px;display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.summary small{color:#d0dccb}.summary strong{font-size:30px;line-height:1.3}.progress{height:5px;background:#ffffff2b;border-radius:9px;margin-top:16px;overflow:hidden;width:210px}.progress i{height:100%;display:block;background:#d4e4a7;border-radius:9px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 18px}.primary{background:var(--green);color:white;border-radius:13px;padding:12px 19px;font-weight:600}.secondary{border:1px solid var(--line);border-radius:12px;padding:10px 15px;background:#fff}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;gap:16px;align-items:center}.habit-open{text-align:left;flex:1;min-width:0;padding:0}.habit-open strong{font-size:18px;display:block;overflow-wrap:anywhere}.habit-open small{color:var(--muted);display:block;margin-top:7px}.icon{display:grid;place-items:center;border-radius:16px;width:49px;height:49px;background:var(--light);font-size:24px;flex-shrink:0}.tick{border:1.5px solid #d9dfd2;border-radius:50%;width:42px;height:42px;font-size:19px;flex-shrink:0}.tick.done{background:var(--green);border-color:var(--green);color:#fff}.empty{border:1.5px dashed #cdd6c2;border-radius:23px;text-align:center;padding:44px 20px;background:#f0f3e8}.empty p{color:var(--muted)}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:20px}.suggestions button{background:white;border:1px solid var(--line);padding:9px 14px;border-radius:30px}footer{margin-top:42px;text-align:center;color:var(--muted);font-size:12px}footer button{text-decoration:underline;color:var(--muted);padding:10px}.back{padding:0;margin-bottom:24px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:20px;margin:26px 0;overflow:hidden}.stats div{padding:22px 10px;text-align:center}.stats div+div{border-left:1px solid var(--line)}.stats strong{display:block;font-size:24px}.stats span{font-size:12px;color:var(--muted)}.stats .date{font-size:17px;line-height:38px}.calendar{background:#fff;border:1px solid var(--line);border-radius:24px;padding:25px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.month button{font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--bg)}button:disabled{opacity:.28;cursor:default}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.week{font-size:12px;color:var(--muted);margin-bottom:12px}.day{aspect-ratio:1;border-radius:15px;font-size:16px;position:relative;max-height:72px}.day:hover:not(:disabled){background:var(--light)}.day.checked,.day.checked:hover{background:var(--green);color:white}.day.today{box-shadow:inset 0 0 0 2px #93aa76}.day.checked:after{content:"";position:absolute;bottom:10%;left:47%;width:5px;height:5px;background:#d9e8ad;border-radius:50%}.legend{display:flex;gap:20px;justify-content:center;color:var(--muted);font-size:12px;margin-top:23px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:6px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 0}dialog{width:min(440px,calc(100% - 32px));border:1px solid var(--line);border-radius:24px;padding:28px;color:var(--ink);box-shadow:0 25px 100px #243c3225}dialog::backdrop{background:#172d2566;backdrop-filter:blur(4px)}label{display:block;font-size:13px;margin:20px 0 7px}input[type=text],input[type=date]{width:100%;border:1px solid #dce2d5;border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);min-height:48px}.emoji-options{display:flex;gap:8px;flex-wrap:wrap}.emoji-options button{font-size:23px;width:43px;height:43px;border-radius:12px;background:var(--bg)}.emoji-options .selected{box-shadow:inset 0 0 0 2px var(--green);background:var(--light)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:28px}.danger{color:#aa5546;margin-top:20px;font-size:13px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#243c32;color:#fff;border-radius:14px;max-width:90vw;width:max-content;z-index:10}.hidden{display:none!important}
@media(max-width:600px){header{padding:20px}.brand{font-size:20px}main{margin:32px auto;padding:0 20px 45px}h1{font-size:30px}.hero{gap:8px}.plant{width:80px;height:80px}.plant svg{width:62px;height:62px}.subtitle{font-size:13px}.cards{grid-template-columns:1fr}.summary{padding:23px;margin-bottom:28px}.progress{width:160px}.card{padding:19px}.calendar{padding:17px 12px}.days,.week{gap:4px}.day{border-radius:12px;font-size:15px}.stats strong{font-size:22px}.stats .date{font-size:14px}.tag{font-size:11px}.primary{padding:11px 15px}h2{font-size:18px}}
</style>
</head><body>
<header><div class="brand"><span>日日</span>习惯打卡</div><div class="tag">每一天，都算数。</div></header>
<main id="app"></main>
<dialog id="editor"><form id="form"><h2 id="editorTitle">种下一个新习惯</h2><p class="subtitle">从一件小事开始，慢慢成为日常。</p><label for="name">习惯名称</label><input id="name" type="text" maxlength="40" required placeholder="例如：每天阅读 20 分钟" autocomplete="off"><label>选择图标</label><div class="emoji-options" id="emojis"></div><label for="start">开始日期</label><input id="start" type="date" required><p class="hint" style="text-align:left">可补记开始日期至今天的打卡。</p><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">保存习惯</button></div><button type="button" class="danger hidden" id="delete">删除这个习惯</button></form></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='riri-habits-v1',icons=['🌱','📖','🏃','💧','🧘','✍️','🌙','🎨'];
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>key(new Date());
function parse(s){const [y,m,d]=s.split('-').map(Number);const date=new Date(0);date.setFullYear(y,m-1,d);date.setHours(12,0,0,0);return date}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s>='1900-01-01'&&key(parse(s))===s}
function previous(s){const d=parse(s);d.setDate(d.getDate()-1);return key(d)}
function streak(h){let d=today(),n=0;const checks=new Set(h.checks);if(!checks.has(d))d=previous(d);while(checks.has(d)){n++;d=previous(d)}return n}
function validate(data){if(!Array.isArray(data)||data.length>1000)throw Error('无效的备份文件');const ids=new Set();return data.map(h=>{if(!h||typeof h.id!=='string'||ids.has(h.id)||typeof h.name!=='string'||!h.name.trim()||h.name.length>40||!validDate(h.start)||h.start>today()||!Array.isArray(h.checks)||!h.checks.every(d=>validDate(d)&&d>=h.start&&d<=today()))throw Error('备份内容或日期无效');ids.add(h.id);return{id:h.id,name:h.name.trim(),icon:icons.includes(h.icon)?h.icon:icons[0],start:h.start,checks:[...new Set(h.checks)].sort()}})}
let habits=[],storageOK=true,active=null,month=today().slice(0,7),editId=null,chosen=icons[0];
try{const raw=localStorage.getItem(KEY);if(raw)habits=validate(JSON.parse(raw))}catch(e){storageOK=false;setTimeout(()=>notify('本地数据读取失败，请先导出备份并重启应用。'),100)}
function persist(next){if(!storageOK){notify('本地存储不可用，未保存更改。请先备份数据。');return false}try{localStorage.setItem(KEY,JSON.stringify(next));habits=next;return true}catch(e){notify('保存失败，手机存储空间不足或不可用。');return false}}
function notify(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function footer(){return `<footer>小小的坚持，也会慢慢发光。<br><button data-action="export">导出备份</button> · <button data-action="import">导入备份</button><br>数据仅保存在本机应用；清除应用数据前请备份。</footer>`}
function render(){const h=habits.find(h=>h.id===active);if(active&&!h)active=null;const app=$('#app');if(!active){const done=habits.filter(h=>h.checks.includes(today())).length;app.innerHTML=`<div class="hero"><div><div class="eyebrow">A LITTLE, EVERY DAY</div><h1>把想做的，变成日常。</h1><p class="subtitle">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})} · 今天也向前一小步</p></div><div class="plant" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none"><path d="M50 85V39" stroke="#375e48" stroke-width="4" stroke-linecap="round"/><path d="M49 60C20 61 18 33 20 25C42 25 57 36 49 60Z" fill="#8d9f66"/><path d="M51 46C49 21 67 13 83 15C82 36 72 47 51 46Z" fill="#375e48"/><path d="M30 85h40" stroke="#375e48" stroke-width="4" stroke-linecap="round"/></svg></div></div><div class="summary"><div><small>今日进度</small><div><strong>${done}</strong> / ${habits.length} 个习惯已完成</div><div class="progress"><i style="width:${habits.length?done/habits.length*100:0}%"></i></div></div><div style="font-size:30px" aria-hidden="true">${habits.length&&done===habits.length?'✦':'☀'}</div></div><div class="section-head"><h2>我的习惯 <span class="tag">${habits.length?` · ${habits.length}`:''}</span></h2><button class="primary" data-action="add">＋ 添加习惯</button></div>${habits.length?`<div class="cards">${habits.map(h=>`<article class="card"><span class="icon">${h.icon}</span><button class="habit-open" data-open="${esc(h.id)}"><strong>${esc(h.name)}</strong><small>已坚持 ${h.checks.length} 天 · 连续 ${streak(h)} 天　›</small></button><button class="tick ${h.checks.includes(today())?'done':''}" data-tick="${esc(h.id)}" aria-label="${esc(h.name)}：${h.checks.includes(today())?'取消今日打卡':'今日打卡'}" aria-pressed="${h.checks.includes(today())}">${h.checks.includes(today())?'✓':'＋'}</button></article>`).join('')}</div>`:`<div class="empty"><div style="font-size:36px">🌱</div><h2>你的改变，从今天开始</h2><p>添加第一个习惯，为每一次坚持留个印记。</p><div class="suggestions"><button data-suggest="每天阅读">📖 每天阅读</button><button data-suggest="运动 30 分钟">🏃 运动 30 分钟</button><button data-suggest="好好喝水">💧 好好喝水</button></div></div>`}${footer()}`;return}
const [y,m]=month.split('-').map(Number),first=parse(month+'-01'),offset=(first.getDay()+6)%7,last=new Date(y,m,0).getDate();app.innerHTML=`<button class="back" data-action="back">← 所有习惯</button><div class="section-head"><div><div class="icon" style="margin-bottom:12px">${h.icon}</div><h1 style="font-size:28px;overflow-wrap:anywhere">${esc(h.name)}</h1></div><button class="secondary" data-action="edit">编辑习惯</button></div><p class="subtitle">不必完美，只要一点点继续。</p><div class="stats"><div><strong class="date">${h.start.replaceAll('-','.')}</strong><span>开始日期</span></div><div><strong>${h.checks.length}<small style="font-size:12px"> 天</small></strong><span>累计打卡</span></div><div><strong>${streak(h)}<small style="font-size:12px"> 天</small></strong><span>当前连续</span></div></div><section class="calendar"><div class="month"><button data-month="-1" aria-label="上个月" ${month<=h.start.slice(0,7)?'disabled':''}>‹</button><h2>${y} 年 ${m} 月</h2><button data-month="1" aria-label="下个月" ${month>=today().slice(0,7)?'disabled':''}>›</button></div><div class="week">${['一','二','三','四','五','六','日'].map(d=>`<span>${d}</span>`).join('')}</div><div class="days">${'<span></span>'.repeat(offset)}${Array.from({length:last},(_,i)=>{const d=month+'-'+pad(i+1),checked=h.checks.includes(d);return `<button class="day ${checked?'checked':''} ${d===today()?'today':''}" data-date="${d}" ${d<h.start||d>today()?'disabled':''} aria-label="${d} ${checked?'已打卡，点击取消':'点击打卡'}" aria-pressed="${checked}">${i+1}</button>`}).join('')}</div><div class="legend"><span><i class="dot"></i>已打卡</span><span><i class="dot" style="background:transparent;border:2px solid #93aa76"></i>今天</span><button data-action="today">回到本月</button></div></section><p class="hint">点击日期打卡，再点一次即可取消。<br>连续天数从今天起计算；今天未打卡时，从昨天起计算。</p>${footer()}`}
function toggle(id,d){const h=habits.find(h=>h.id===id);if(!h||d<h.start||d>today())return;const checked=h.checks.includes(d);if(persist(habits.map(x=>x.id===id?{...x,checks:checked?x.checks.filter(v=>v!==d):[...x.checks,d].sort()}:x))){render();notify(checked?'已取消打卡':'已记录，又一次小小的坚持 ✓')}}
function emojiRender(){$('#emojis').innerHTML=icons.map(e=>`<button type="button" data-emoji="${e}" class="${e===chosen?'selected':''}" aria-label="选择 ${e}" aria-pressed="${e===chosen}">${e}</button>`).join('')}
function editor(h=null,suggestion=''){editId=h?.id||null;chosen=h?.icon||(suggestion.includes('阅读')?'📖':suggestion.includes('运动')?'🏃':suggestion.includes('喝水')?'💧':icons[0]);$('#editorTitle').textContent=h?'编辑习惯':'种下一个新习惯';$('#name').value=h?.name||suggestion;$('#start').value=h?.start||today();$('#start').min='1900-01-01';$('#start').max=today();$('#delete').classList.toggle('hidden',!h);emojiRender();$('#editor').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.open){active=b.dataset.open;month=today().slice(0,7);render();window.scrollTo(0,0)}if(b.dataset.tick)toggle(b.dataset.tick,today());if(b.dataset.date)toggle(active,b.dataset.date);if(b.dataset.suggest)editor(null,b.dataset.suggest);if(b.dataset.emoji){chosen=b.dataset.emoji;emojiRender()}if(b.dataset.month){const d=parse(month+'-01');d.setMonth(d.getMonth()+Number(b.dataset.month));month=key(d).slice(0,7);render()}switch(b.dataset.action){case'add':editor();break;case'back':active=null;render();break;case'edit':editor(habits.find(h=>h.id===active));break;case'today':month=today().slice(0,7);render();break;case'export':{const blob=new Blob([JSON.stringify({version:1,habits},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`日日习惯备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'import':$('#importFile').click();break}});
$('#cancel').onclick=()=>$('#editor').close();
$('#form').onsubmit=e=>{e.preventDefault();const name=$('#name').value.trim(),start=$('#start').value;if(!name||!validDate(start)||start>today()){notify('请填写习惯名称和有效的开始日期。');return}const old=habits.find(h=>h.id===editId);if(old?.checks.some(d=>d<start)){notify('开始日期不能晚于已有打卡，请先取消较早的记录。');return}const h={id:old?.id||globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random(),name,icon:chosen,start,checks:old?.checks||[]};if(persist(old?habits.map(x=>x.id===old.id?h:x):[...habits,h])){$('#editor').close();month=today().slice(0,7);render();notify(old?'习惯已更新':'新习惯已添加，开始第一天吧')}};$('#delete').onclick=()=>{if(confirm('删除这个习惯和全部打卡记录？此操作无法撤销。')&&persist(habits.filter(h=>h.id!==editId))){active=null;$('#editor').close();render()}};
$('#importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>5e6)throw Error('备份文件过大');const obj=JSON.parse(await file.text());if(obj.version!==1)throw Error('不支持的备份版本');const next=validate(obj.habits);if(confirm(`将使用备份中的 ${next.length} 个习惯替换当前数据。建议先导出当前数据。继续？`)&&persist(next)){active=null;render();notify('备份已恢复')}}catch(err){notify('导入失败：'+err.message)}};
window.addEventListener('storage',e=>{if(e.key===KEY){try{habits=validate(JSON.parse(e.newValue||'[]'));render()}catch{notify('其他窗口的数据无法读取')}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(!document.hidden)render()},60000);
render();

// Native document picker integration; local data stays in the WebView store.
document.addEventListener('click', e => {
  if (!window.AndroidBackup) return;
  const b=e.target.closest('button');
  if (!b) return;
  if (b.dataset.action==='export') {
    e.preventDefault();e.stopImmediatePropagation();
    AndroidBackup.exportBackup(JSON.stringify({version:1,habits},null,2));
  } else if (b.dataset.action==='import') {
    e.preventDefault();e.stopImmediatePropagation();
    AndroidBackup.importBackup();
  }
},true);
window.receiveAndroidBackup=function(text) {
  try {
    const obj=JSON.parse(text);
    if(obj.version!==1)throw Error('不支持的备份版本');
    const next=validate(obj.habits);
    if(confirm('将使用备份中的 '+next.length+' 个习惯替换当前数据。继续？')&&persist(next)){
      active=null;render();notify('备份已恢复');
    }
  } catch(e) {notify('导入失败：'+e.message);}
};
</script></body></html>
